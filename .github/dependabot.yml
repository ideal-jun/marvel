version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      maven-minor-patch:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]

  - package-ecosystem: npm
    directory: /marvel-ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
