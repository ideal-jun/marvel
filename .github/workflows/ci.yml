name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit tests (mvn verify)
        run: mvn -B -ntp verify

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marvel-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: marvel-ui/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint & format check (oxc)
        run: |
          pnpm run lint
          pnpm run format:check
      - name: Type-check & build
        run: pnpm run build
      - name: Unit tests
        run: pnpm run test

  sca:
    name: SCA (SBOM + dependency-check)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Cache OWASP dependency-check data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp
          key: dependency-check-${{ runner.os }}-${{ hashFiles('pom.xml', '**/pom.xml') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-
      - name: Install modules
        run: mvn -B -ntp -DskipTests install
      - name: Generate SBOM and run OWASP dependency-check
        run: mvn -B -ntp -DskipTests -Psecurity-scan verify
        env:
          # 未配置 secret 时仍可运行，但 NVD 数据更新受限（更慢、可能漏报最新 CVE）
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        continue-on-error: true
      - name: Upload CycloneDX SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: target/bom.json
          if-no-files-found: warn
      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check
          if-no-files-found: warn
