server:
  port: 8080

spring:
  application:
    name: marvel-admin
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/marvel?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: null

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  # 会话有效期 7 天；连续 2 小时无操作自动失效（避免长期有效令牌被窃取后滥用）
  timeout: 604800
  active-timeout: 7200
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

marvel:
  storage:
    # 存储实现：local（本地磁盘，默认）| minio（对象存储）
    type: ${STORAGE_TYPE:local}
    local:
      path: ${UPLOAD_PATH:./uploads}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:marvel}
      # 对外访问基址（走 CDN/反向代理时填写）；留空则生成预签名 URL
      public-url: ${MINIO_PUBLIC_URL:}
      # 桶匿名只读：true 时 toUrl 返回稳定直链，便于 <img> 直接展示
      public-read: ${MINIO_PUBLIC_READ:true}
      presign-expiry-seconds: ${MINIO_PRESIGN_EXPIRY:604800}
  job:
    pool-size: ${JOB_POOL_SIZE:4}
    # 单次触发失败后的自动重试次数（不含首次执行）
    retry-times: ${JOB_RETRY_TIMES:1}
  log:
    # 审计日志保留天数，<=0 关闭清理
    retention-days: ${LOG_RETENTION_DAYS:90}
  security:
    # CORS 白名单（逗号分隔）。留空表示同源部署（开发期前端走 Vite 代理）；
    # 生产环境必须配置为前端实际域名，禁止使用 "*"
    allowed-origins: ${ALLOWED_ORIGINS:}
    # 是否信任 X-Forwarded-For / X-Real-IP。默认 false：仅当部署在可信反向代理之后才开启，
    # 否则客户端可伪造 IP 绕过登录防爆破锁定并污染审计日志
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}

management:
  endpoints:
    web:
      exposure:
        # 只暴露健康检查；env/beans/heapdump/info 等一律不开放
        include: health
  endpoint:
    health:
      # 永不返回组件细节，避免泄露数据库/Redis 等内部信息
      show-details: never
      probes:
        enabled: true

logging:
  level:
    com.marvel: info
